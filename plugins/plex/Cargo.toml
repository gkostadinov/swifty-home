[package]
name = "swifty-plugin-plex"
description = "Swifty Home plugin for Plex Media Server: whether the server is up and accepts its token. Read-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "swifty_plugin_plex"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
# The header type the HTTP client takes, so the token can be marked sensitive.
# The same crate and major version the client already uses.
http = "1"
serde.workspace = true
serde_json.workspace = true
swifty-net.workspace = true
swifty-plugin-api.workspace = true
url.workspace = true

[dev-dependencies]
swifty-plugin-testkit.workspace = true
tokio.workspace = true
