[package]
name = "swifty-plugin-hue"
description = "Philips Hue for Swifty Home: the bridge's local REST API, paired with the link button"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "swifty_plugin_hue"
path = "src/lib.rs"

# Sockets only through swifty-net, which every helper of takes a LiveGrant.
# `url` only parses the configured bridge address; it opens nothing.
[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
swifty-net.workspace = true
swifty-plugin-api.workspace = true
url.workspace = true

[dev-dependencies]
swifty-plugin-testkit.workspace = true
tokio.workspace = true
