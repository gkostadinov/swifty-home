[package]
name = "swifty-plugin-mock"
description = "Swifty Home plugin: in-memory devices of every class, for tests and for the demo home"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "swifty_plugin_mock"
path = "src/lib.rs"

# The mock reaches nothing, so it needs no socket helpers of its own: what it
# uses of swifty-net comes through swifty-plugin-api. tokio is only for the
# timers behind the `Hang` and `Slow` behaviours.
[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
swifty-plugin-api.workspace = true
tokio.workspace = true

[dev-dependencies]
swifty-plugin-testkit.workspace = true
