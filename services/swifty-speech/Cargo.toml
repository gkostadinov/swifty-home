[package]
name = "swifty-speech"
version = "1.0.0"
edition = "2021"
description = "Local speech-to-text service for Swifty Home, for Windows"
license = "Apache-2.0"
publish = false

[dependencies]
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
socket2 = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
# Decoding is wrapped in catch_unwind, which needs unwinding. Do not set panic = "abort".
panic = "unwind"
strip = "symbols"
