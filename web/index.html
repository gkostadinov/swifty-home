<div id="scene" aria-hidden="true">
  <div class="bloom" data-b="1" style="--h:38;--a:0"></div>
  <div class="bloom" data-b="2" style="--h:30;--a:0"></div>
  <div class="bloom" data-b="3" style="--h:205;--a:0"></div>
  <div class="bloom" data-b="4" style="--h:14;--a:0"></div>
  <div class="horizon"></div>
  <canvas class="rays" id="rays"></canvas>
  <div class="veil"></div>
  <div class="cool"></div>
</div>

<div id="app" class="wrap">
  <header class="top" id="top">
    <div class="titleblock">
      <h1 class="title" id="title" aria-live="polite">All is well at home.</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <button class="g lens capsule press" data-lens="top" id="cap-top" aria-label="Search or ask Swifty. Opens More: account, rooms, history and settings" aria-haspopup="dialog"><span class="lbl">Search or ask Swifty</span><span class="micwrap"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></span></button>
  </header>

  <section id="view-fav" class="view" aria-label="Home">
    <div class="roompick" id="roompick" role="radiogroup" aria-label="Which lights" hidden></div>
    <div class="g lens scenes" data-lens="scenes" id="scenes" role="group" aria-label="Lights">
      <div class="ind" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3" hidden></i></div>
      <button class="seg" data-scene="Movie" aria-pressed="false">Movie</button>
      <button class="seg" data-scene="Evening" aria-pressed="false">Evening</button>
      <button class="seg" data-scene="Lights off" aria-pressed="false">Lights off</button>
      <button class="seg" aria-pressed="false" hidden></button>
    </div>
    <div class="row main">
      <div class="g lens tile h220 lights press" data-lens="lights" id="t-lights" role="slider" tabindex="0" aria-label="Lights brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-key="lights"></div>
      <div class="g lens tile h220 music press" data-lens="music" id="t-music" role="slider" tabindex="0" aria-label="Music and TV volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-key="speaker"></div>
    </div>
    <div class="g tvbar" id="tvbar" role="group" aria-label="TV" hidden></div>
    <div class="row plugs" id="plugs" role="group" aria-label="Sockets" hidden></div>
    <div class="row plugs" id="acs" role="group" aria-label="Air conditioning" hidden></div>
    <div class="row comps" id="comps"></div>
    <div class="row small" id="smalls"></div>
  </section>

  <section id="view-rooms" class="view" aria-label="Rooms" hidden>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
      <h2 style="font-size:24px;font-weight:600">Rooms</h2>
      <button class="pill g" id="rooms-back" style="padding:0 18px;font-size:17px"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg>Home</button>
    </div>
    <p class="p2" id="rooms-hint" style="margin-top:-8px">Drag a room to set its lights. Tap it for more.</p>
    <div id="rooms-grid" class="roomgrid"></div>
    <div class="acts" id="rooms-tools"></div>
  </section>

  <p class="simnote" id="simnote" hidden></p>
</div>

<button class="g lens capsule bottomcap press" data-lens="bottom" id="cap-bottom" aria-label="Search or ask Swifty. Opens More: account, rooms, history and settings" aria-haspopup="dialog"><span class="lbl">Search or ask Swifty</span><span class="micwrap"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></span></button>

<div id="dim" hidden></div>
<div id="sheet" class="g strong" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-glow" aria-hidden="true"></div>
  <div class="grab" aria-hidden="true"></div>
  <div class="shead" id="shead">
    <button class="back" id="sheet-back" aria-label="Back" hidden><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
    <h2 id="sheet-title" tabindex="-1"></h2>
    <button class="close" id="sheet-close" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <div class="sbody" id="sbody"></div>
</div>

<div id="lock" hidden>
  <div>
    <button class="g unlock press" id="unlockbtn" aria-label="Unlock with your passkey"><span class="needle" aria-hidden="true"></span><span class="near" aria-hidden="true"><svg class="ic" style="--i:0;--x:-34px;--y:-33px"><use href="#i-bulb"/></svg><svg class="ic" style="--i:1;--x:34px;--y:-33px"><use href="#i-speaker"/></svg><svg class="ic" style="--i:2;--x:34px;--y:34px"><use href="#i-tv"/></svg><svg class="ic" style="--i:3;--x:-34px;--y:34px"><use href="#i-camera"/></svg></span><svg class="mk" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.2l8 7M6 9.8V18a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9.8"/><circle cx="12" cy="16.8" r="1"/><path class="sig" d="M9.9 14.6a3 3 0 0 1 4.2 0"/><path class="sig far" d="M8.2 12.8a5.4 5.4 0 0 1 7.6 0"/></svg></button>
    <div class="lk" id="locktext">Unlock<small id="locksub">Touch to use your passkey on this desktop.</small></div>
    <div class="who" id="lockwho" role="group" aria-label="Who is signing in"></div>
    <div class="devs" id="lockdevs"></div>
  </div>
</div>

<div id="wall" hidden>
  <button class="g exit press" id="wall-exit">Leave the wall</button>
  <div class="wt"><h1 id="wall-title">All is well at home.</h1><span class="clock num" id="wall-clock">00:00</span></div>
  <div class="wl">
    <div class="roompick" id="wall-roompick" role="radiogroup" aria-label="Which lights" hidden></div>
    <div class="g lens scenes" data-lens="wscenes" id="wall-scenes" role="group" aria-label="Lights">
      <div class="ind" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3" hidden></i></div>
      <button class="seg" data-scene="Movie" aria-pressed="false">Movie</button>
      <button class="seg" data-scene="Evening" aria-pressed="false">Evening</button>
      <button class="seg" data-scene="Lights off" aria-pressed="false">Lights off</button>
      <button class="seg" aria-pressed="false" hidden></button>
    </div>
    <div class="g lens tile lights press" data-lens="wlights" id="w-lights" role="slider" tabindex="0" aria-label="Lights brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-key="lights"></div>
    <div class="g lens tile music press" data-lens="wmusic" id="w-music" role="slider" tabindex="0" aria-label="Music and TV volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-key="speaker"></div>
  </div>
  <div class="wr">
    <button class="g ptt press" id="w-ptt" aria-label="Tap to talk"><span class="micwrap"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></span><span>Tap to talk</span></button>
    <button class="g cap press" id="w-pets" data-sheet="pets"><svg class="ic" aria-hidden="true"><use href="#i-paw"/></svg><span class="lbl">Pets</span><span class="st" id="w-pets-st"></span></button>
  </div>
  <div class="wf"><span>For computers and settings, use your phone.</span><span id="wall-sim"></span></div>
  <div class="ambient" id="ambient"><div class="bigclock" id="bigclock">00:00</div><div class="sentence" id="ambient-sentence">All is well at home.</div></div>
  <div class="attn" id="attn"><svg class="ic" aria-hidden="true"><use href="#i-warn"/></svg><h2 id="attn-text"></h2><p>Touch to see the controls.</p></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/app/main.js"></script>
