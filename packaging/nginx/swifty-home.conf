# Swifty Home behind nginx: a generic template.
#
# Copy it to /etc/nginx/conf.d/swifty-home.conf (or sites-available, then link it), replace
# home.example.org and the two certificate paths, then: sudo nginx -t && sudo systemctl reload nginx
#
# The name must be exactly the `origin` in /etc/swifty-home/swifty.toml (`rp_id` is the name
# without https://). The hub refuses any request whose Origin is not that exact address.

# Slows down guessing at the sign-in endpoints.
limit_req_zone $binary_remote_addr zone=swifty_auth:1m rate=2r/s;

upstream swifty_home {
    server 127.0.0.1:8790;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name home.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 on;    # nginx 1.25.1 and later
    server_name home.example.org;

    ssl_certificate     /etc/ssl/swifty-home/fullchain.pem;
    ssl_certificate_key /etc/ssl/swifty-home/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;

    # The hub sets its own limits; this only stops very large bodies early.
    client_max_body_size 1m;

    # A location that sets any proxy_set_header inherits none of these, so each one below
    # repeats what it needs.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    location / {
        proxy_pass http://swifty_home;
    }

    location /api/v1/auth/ {
        limit_req zone=swifty_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://swifty_home;
    }

    # Server-sent events: never buffered, and kept open.
    location = /api/v1/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://swifty_home;
    }

    # Voice clips are up to 8 MiB. With buffering off, a clip goes straight to the hub and
    # nginx never writes it to a temporary file.
    location = /api/v1/voice {
        client_max_body_size 9m;
        proxy_request_buffering off;
        proxy_pass http://swifty_home;
    }

    # The console's WebSocket. Its ticket travels in Sec-WebSocket-Protocol, which nginx
    # passes on and does not log.
    location = /api/v1/console/connect {
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://swifty_home;
    }
}
